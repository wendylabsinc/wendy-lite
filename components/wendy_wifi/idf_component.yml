dependencies:
  idf:
    version: ">=5.1.0"
  espressif/mdns:
    version: "*"
  # The ESP32-P4 has no radio. ESP-Hosted bridges Wi-Fi through the board's
  # co-processor, and esp_wifi_remote implements the esp_wifi API on top of
  # it. They are here, not in an app's main component, so that every app
  # using wendy_wifi (the firmware and native apps) gets them. The app's
  # sdkconfig still selects the co-processor and its transport pins.
  espressif/esp_wifi_remote:
    version: ">=1.3.1"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    # Keep the P4 transport patch and C6 companion build on the same release.
    # Match wendy_ble and tools/espnow-companion/build.sh.
    version: "==2.13.1"
    rules:
      - if: "target == esp32p4"
  wendy_com:
    override_path: "../wendy_com"
  wendy_server:
    override_path: "../wendy_server"
  wendy_cloud:
    override_path: "../wendy_cloud"
  wendy_conf:
    override_path: "../wendy_conf"
