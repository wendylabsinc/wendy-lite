dependencies:
  espressif/esp32-camera:
    version: "^2.0.0"
    rules:
      - if: "target == esp32s3 && $CONFIG{WENDY_SENSOR_LINK_XIAO_ESP32S3} == True"
  espressif/esp_video:
    version: "2.5.0"
    rules:
      - if: "target == esp32s31 && ($CONFIG{WENDY_SENSOR_LINK_ESP32S31_KORVO_1} == True || $CONFIG{WENDY_SENSOR_LINK_MOSAICO} == True)"
  espressif/esp_codec_dev:
    version: "2.0.0-beta4"
    rules:
      - if: "target == esp32s31 && $CONFIG{WENDY_SENSOR_LINK_ESP32S31_KORVO_1} == True"
  # ESP-IDF omits the Mosaico symbol when its target or Korvo dependency is
  # false. Short-circuit those profiles before reading the symbol.
  esp-mosaico-bsp:
    git: https://github.com/esp-mosaico/esp-mosaico-bsp.git
    version: 5f88b91e1be055d1d3674364123b2779a1758377
    path: components/esp-mosaico-bsp
    rules:
      - if: "target == esp32s31 && ($CONFIG{WENDY_SENSOR_LINK_ESP32S31_KORVO_1} == False && $CONFIG{WENDY_SENSOR_LINK_MOSAICO} == True)"
  mosaico_module_camera:
    git: https://github.com/esp-mosaico/esp-mosaico-bsp.git
    version: 5f88b91e1be055d1d3674364123b2779a1758377
    path: components/mosaico_module_camera
    rules:
      - if: "target == esp32s31 && ($CONFIG{WENDY_SENSOR_LINK_ESP32S31_KORVO_1} == False && $CONFIG{WENDY_SENSOR_LINK_MOSAICO} == True)"
