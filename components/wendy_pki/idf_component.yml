dependencies:
  idf:
    version: ">=6.0.3"
  # Apps that fetch Wendy components over git cannot check out paths inside
  # the components/esp-pqc submodule, so fetch esp-pqc from its own repository.
  # Keep this revision equal to the submodule commit. Projects built from this
  # checkout override it with the submodule in their main manifest.
  esp-pqc:
    git: "https://github.com/espressif/esp-pqc.git"
    version: "37953195672cbc7502b06fc845fc9219627f31fd"
  espressif/cjson:
    version: "^1.7.19"
