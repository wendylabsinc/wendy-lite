dependencies:
  idf:
    version: ">=6.0.3"
  # Build the pinned submodule instead of the git revision wendy_pki names.
  esp-pqc:
    override_path: "../components/esp-pqc"
  # ESP-Hosted bridges Wi-Fi + BT through the on-board ESP32-C6 on the
  # ESP32-P4 FireBeetle 2 (DFR1172). On the native-radio C6 build these
  # components do nothing, so guard them with target rules.
  espressif/esp_wifi_remote:
    version: ">=1.3.1"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    # esp_hosted 3.0 restructured its BT Kconfig (breaking change); stay on 2.x
    # until that migration is done. See:
    # https://github.com/espressif/esp-hosted/blob/unified_release/docs/migration.md
    version: ">=2.0,<3.0"
    rules:
      - if: "target == esp32p4"
