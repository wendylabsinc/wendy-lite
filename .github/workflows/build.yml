name: Build Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # catalog.json is the single source of truth for the set of firmware variants.
  # Its `binaries` array is shaped exactly like a matrix `include` list, so it
  # can be handed to strategy.matrix as-is.
  catalog:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Generate build matrix from catalog
        id: gen
        run: |
          # catalog.json names are unprefixed (e.g. "esp32c5"); artifacts,
          # release assets, and GCS publish paths have a wendy_mcu_ prefix,
          # stored as asset_name here for downstream jobs to use.
          echo "matrix=$(jq -c '{include: (.binaries | map({idf_version: "v6.0.3", preview: false, project_dir: "."} + . + {asset_name: ("wendy_mcu_" + .name)}))}' catalog.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: catalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    container:
      image: ${{ matrix.idf_image || format('espressif/idf:{0}', matrix.idf_version) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Trust checkout paths in the build container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"


      # The version a device reports comes from CONFIG_WENDY_FIRMWARE_VERSION_*
      # (components/wendy_core/Kconfig), whose defaults are a dev placeholder.
      # On a tag build the real version is derived from the tag here. The file
      # is always written, even when empty: a file listed in SDKCONFIG_DEFAULTS
      # that does not exist is a CMake FATAL_ERROR, and keeping the build
      # command uniform means PRs exercise this path too.
      - name: Generate version.defaults from tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          echo "# Generated by .github/workflows/build.yml. Not tracked." > version.defaults
          if [ "$IS_TAG" != "true" ]; then
            echo "Not a tag build: keeping Kconfig version defaults."
            exit 0
          fi
          VERSION="${REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::tag '${REF_NAME}' is not vX.Y.Z"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          # APP_PROJECT_VER_* pins esp_app_desc_t.version (what esptool
          # image_info and OTA checks read) to the tag as well; otherwise IDF
          # falls back to git describe, which degrades to "1" on CI's shallow
          # checkout.
          cat >> version.defaults <<EOF
          CONFIG_WENDY_FIRMWARE_VERSION_MAJOR=${MAJOR}
          CONFIG_WENDY_FIRMWARE_VERSION_MINOR=${MINOR}
          CONFIG_WENDY_FIRMWARE_VERSION_PATCH=${PATCH}
          CONFIG_APP_PROJECT_VER_FROM_CONFIG=y
          CONFIG_APP_PROJECT_VER="${VERSION}"
          EOF
          echo "FW_VERSION=${VERSION}" >> "$GITHUB_ENV"
          cat version.defaults

      - name: Build firmware
        shell: bash
        env:
          BOARD_CFG: ${{ matrix.board_cfg }}
          TARGET: ${{ matrix.target }}
          PREVIEW: ${{ matrix.preview }}
          PROJECT_DIR: ${{ matrix.project_dir }}
        run: |
          . "$IDF_PATH/export.sh"
          idf_args=()
          if [ "$PREVIEW" = true ]; then
            idf_args+=(--preview)
          fi
          if [ "$PROJECT_DIR" != . ]; then
            idf.py "${idf_args[@]}" -C "$PROJECT_DIR" -B "$GITHUB_WORKSPACE/build" \
              -D SDKCONFIG="$GITHUB_WORKSPACE/build/sdkconfig" \
              -D WENDY_VERSION_DEFAULTS="$GITHUB_WORKSPACE/version.defaults" build
            exit 0
          fi
          # boards/<board>.cfg is a one-line idf.py argfile holding
          # "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;boards/<board>.defaults".
          # Read it and suffix version.defaults so it is applied last and wins
          # (kconfgen applies --defaults files in order, later overriding
          # earlier). It has to go on set-target: that is what regenerates
          # sdkconfig from the whole chain.
          idf.py "${idf_args[@]}" "$(cat "boards/${BOARD_CFG}.cfg");version.defaults" \
            set-target "$TARGET"
          idf.py "${idf_args[@]}" build

      - name: Verify mesh defaults
        shell: bash
        env:
          BOARD_CFG: ${{ matrix.board_cfg }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("build/config/sdkconfig.json").read_text())
          enabled = os.environ["BOARD_CFG"] in {
              "seeed_xiao_esp32s3_native", "esp32s31_korvo_1_native",
              "esp32s31_mosaico_native",
          }
          for option in ("WENDY_MESH_LEAF", "WENDY_MESH_WIFI_BLE", "WENDY_MESH_AUTO_DISCOVER"):
              assert bool(config.get(option)) == enabled, f"unexpected {option} for this board"
          if enabled:
              assert config.get("LWIP_IPV6") and config.get("LWIP_HOOK_IP6_ROUTE_CUSTOM")
              assert not config.get("LWIP_IPV6_FORWARD")
              assert config["BT_NIMBLE_L2CAP_COC_MAX_NUM"] >= 2
              assert config["BT_NIMBLE_MSYS_1_BLOCK_SIZE"] >= 248
          PY

      - name: Verify ESP32-S31 native profile
        if: matrix.target == 'esp32s31'
        shell: bash
        env:
          BOARD_CFG: ${{ matrix.board_cfg }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          build = Path("build")
          config = json.loads((build / "config/sdkconfig.json").read_text())
          for option in ("WENDY_WIFI_ENABLED", "WENDY_BLE",
                         "BT_NIMBLE_ENABLED", "WENDY_CLOUD", "WENDY_PKI",
                         "WENDY_CORE_WATCHDOG", "BOOTLOADER_WDT_DISABLE_IN_USER_CODE",
                         "MBEDTLS_USE_BUNDLED_PQC", "MBEDTLS_SSL_TLS1_3_SIG_MLDSA65"):
              assert config.get(option), f"{option} must be enabled"
          for option in ("WENDY_CORE_WASM_APP_SUPPORT", "MBEDTLS_DYNAMIC_BUFFER"):
              assert not config.get(option), f"{option} must be disabled"
          assert config["BT_NIMBLE_L2CAP_COC_MAX_NUM"] == (2 if config.get("WENDY_MESH_WIFI_BLE") else 1)
          components = json.loads((build / "project_description.json").read_text())["build_components"]
          assert not {"espressif__wasm-micro-runtime", "wendy_wasm", "wendy_hal"}.intersection(components)
          flash = json.loads((build / "flasher_args.json").read_text())
          assert flash["bootloader"]["offset"] == "0x2000"
          assert config.get("ESPTOOLPY_NO_STUB")
          assert flash["extra_esptool_args"]["stub"] is False
          assert flash["extra_esptool_args"]["chip"] == "esp32s31"
          if os.environ["BOARD_CFG"] != "esp32s31_mosaico_native":
              assert config.get("WENDY_USJ")
          if os.environ["BOARD_CFG"] == "esp32s31_generic_native":
              assert not config.get("SPIRAM")
              assert not config.get("WENDY_USJ_USE_UART")
              assert "esp_driver_usb_serial_jtag" in components
              assert not config.get("WENDY_SENSOR_LINK_ESP32S31_KORVO_1")
              assert not config.get("WENDY_DISPLAY_ESP32S31_KORVO_1")
              assert config["PARTITION_TABLE_CUSTOM_FILENAME"] == "partitions.ota.csv"
              assert flash["flash_settings"] == {
                  "flash_size": "4MB", "flash_mode": "dio", "flash_freq": "40m",
              }
          elif os.environ["BOARD_CFG"] == "esp32s31_korvo_1_native":
              for option in ("SPIRAM", "SPIRAM_MODE_OCT", "SPIRAM_TRY_ALLOCATE_WIFI_LWIP",
                             "COMPILER_OPTIMIZATION_PERF", "WENDY_SENSOR_LINK_ESP32S31_KORVO_1",
                             "ESP_VIDEO_ENABLE_DVP_VIDEO_DEVICE", "CAMERA_XCLK_USE_LEDC",
                             "CAMERA_OV3660", "CAMERA_SC101IOT", "WENDY_DISPLAY_ESP32S31_KORVO_1"):
                  assert config.get(option), f"{option} must be enabled on Korvo-1"
              assert config["SPIRAM_SPEED"] == 200
              assert config["SPIRAM_MALLOC_RESERVE_INTERNAL"] == 98304
              assert config["SPIRAM_MALLOC_ALWAYSINTERNAL"] == 1024
              assert not config.get("SPIRAM_XIP_FROM_PSRAM")
              assert config["ESP_DEFAULT_CPU_FREQ_MHZ"] == 320
              assert config["FREERTOS_NUMBER_OF_CORES"] == 2
              assert config.get("WENDY_USJ_USE_UART")
              assert config.get("ESP_CONSOLE_UART_DEFAULT")
              assert config["ESP_CONSOLE_UART_NUM"] == 0
              assert config["ESP_CONSOLE_UART_BAUDRATE"] == 115200
              assert config.get("ESP_CONSOLE_SECONDARY_NONE")
              assert not config.get("ESP_CONSOLE_NONE")
              assert config["WENDY_USJ_UART_TX_GPIO"] == 58
              assert config["WENDY_USJ_UART_RX_GPIO"] == 59
              assert "esp_driver_uart" in components
              assert config["ESP_WIFI_STATIC_RX_BUFFER_NUM"] == 16
              assert config["ESP_WIFI_STATIC_TX_BUFFER_NUM"] == 16
              assert config["ESP_WIFI_RX_BA_WIN"] == 16
              assert config["LWIP_TCP_SND_BUF_DEFAULT"] == 17280
              assert config["LWIP_TCP_WND_DEFAULT"] == 17280
              assert config["LWIP_TCP_RECVMBOX_SIZE"] == 14
              assert config["PARTITION_TABLE_CUSTOM_FILENAME"] == "partitions.ota.16mb.csv"
              assert {"espressif__esp_video", "espressif__esp_codec_dev", "wendy_sensor_link",
                      "wendy_display", "esp_lcd"}.issubset(components)
              assert config.get("ESPTOOLPY_FLASHMODE_QIO")
              # IDF writes a DIO ROM header; its bootloader enables QIO.
              assert flash["flash_settings"] == {
                  "flash_size": "16MB", "flash_mode": "dio", "flash_freq": "80m",
              }
              assert flash["otadata"]["offset"] == "0xfc0000"
          elif os.environ["BOARD_CFG"] == "esp32s31_mosaico_native":
              for option in ("SPIRAM", "WENDY_MESH_LEAF", "WENDY_MESH_WIFI_BLE",
                             "WENDY_MESH_AUTO_DISCOVER", "LWIP_HOOK_IP6_ROUTE_CUSTOM",
                             "LV_OS_FREERTOS", "LV_USE_CLIB_MALLOC", "TINYUSB_CDC_ENABLED"):
                  assert config.get(option), f"{option} must be enabled on Mosaico"
              assert not config.get("WENDY_USJ")
              assert config["TINYUSB_CDC_COUNT"] == 2
              assert config["ESPTOOLPY_FLASHSIZE"] == "16MB"
              assert flash["otadata"]["offset"] == "0x7c0000"
              assert config.get("BOOTLOADER_APP_ROLLBACK_CONFIRM_BY_APP")
              assert config["SPIRAM_MALLOC_ALWAYSINTERNAL"] == 64
              assert config["SPIRAM_MALLOC_RESERVE_INTERNAL"] == 131072
              # Unpatched SDK headers have a different PQC key layout from
              # the bundled libraries and silently break certificate parsing.
              import shlex
              sdk_vendor = Path(os.environ["IDF_PATH"]) / "components" / "mbedtls" / "mbedtls"
              commands = json.loads((build / "compile_commands.json").read_text())
              for command in commands:
                  for arg in shlex.split(command["command"]):
                      if arg.startswith("-I"):
                          assert not Path(arg[2:]).is_relative_to(sdk_vendor), command["file"]
          else:
              raise AssertionError(f"Unverified ESP32-S31 board: {os.environ['BOARD_CFG']}")
          PY

      - name: Compile ESP32-S31-Korvo-1 benchmark variant
        if: matrix.board_cfg == 'esp32s31_korvo_1_native'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --preview -B build-korvo-benchmark \
            -D SDKCONFIG="$PWD/build-korvo-benchmark/sdkconfig" \
            -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;boards/esp32s31_korvo_1_native.defaults;boards/esp32s31_korvo_1_benchmark.defaults;version.defaults' \
            -D IDF_TARGET=esp32s31 build
          python - <<'PY'
          import json
          from pathlib import Path

          release = Path("build")
          release_config = json.loads((release / "config/sdkconfig.json").read_text())
          assert not release_config.get("WENDY_KORVO_BENCHMARK")
          build = Path("build-korvo-benchmark")
          config = json.loads((build / "config/sdkconfig.json").read_text())
          assert config.get("WENDY_KORVO_BENCHMARK")
          assert config["FREERTOS_NUMBER_OF_CORES"] == 2
          assert config.get("NN_OPTIMIZED") and not config.get("NN_ANSI_C")
          for key in ("WENDY_USJ_USE_UART", "WENDY_USJ_UART_TX_GPIO", "WENDY_USJ_UART_RX_GPIO",
                      "ESP_CONSOLE_UART_DEFAULT", "ESP_CONSOLE_UART_NUM", "ESP_CONSOLE_UART_BAUDRATE",
                      "ESP_CONSOLE_SECONDARY_NONE", "ESPTOOLPY_NO_STUB", "SPIRAM_SPEED",
                      "PARTITION_TABLE_CUSTOM_FILENAME", "WENDY_SENSOR_LINK_ESP32S31_KORVO_1",
                      "WENDY_DISPLAY_ESP32S31_KORVO_1"):
              assert config.get(key) == release_config.get(key), f"Board setting differs for {key}"
          for key in ("WENDY_FIRMWARE_VERSION_MAJOR", "WENDY_FIRMWARE_VERSION_MINOR",
                      "WENDY_FIRMWARE_VERSION_PATCH", "APP_PROJECT_VER"):
              assert config.get(key) == release_config.get(key), f"Version differs for {key}"
          components = json.loads((build / "project_description.json").read_text())["build_components"]
          assert {"wendy_benchmark", "espressif__esp-nn"}.issubset(components)
          PY

      # Fail the release rather than ship a binary carrying the placeholder
      # version under a vX.Y.Z tag. sdkconfig.h is what the firmware sources
      # actually compile against.
      - name: Verify release version landed in the build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          hdr=build/config/sdkconfig.h
          field() { sed -n "s/^#define CONFIG_WENDY_FIRMWARE_VERSION_$1 //p" "$hdr"; }
          got="$(field MAJOR).$(field MINOR).$(field PATCH)"
          if [ "$got" != "$FW_VERSION" ]; then
            echo "::error::firmware version is ${got}, expected ${FW_VERSION}"
            exit 1
          fi
          echo "firmware version ${FW_VERSION} confirmed in ${hdr}"

      - name: Create merged firmware binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          . "$IDF_PATH/export.sh"
          cd build
          esptool.py --chip "$TARGET" merge_bin \
            -o "${ASSET_NAME}.bin" \
            @flash_args

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: build/${{ matrix.asset_name }}.bin

  nightly:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete existing nightly release and tag if present
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          # Create new nightly pre-release at current commit. catalog.json ships
          # alongside the binaries so consumers can discover the variants.
          gh release create nightly \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Nightly" \
            --notes "Automated nightly build from \`main\` ($(date -u '+%Y-%m-%d %H:%M UTC')), commit ${{ github.sha }}" \
            $(jq -r '.binaries[] | "wendy_mcu_\(.name)/wendy_mcu_\(.name).bin"' catalog.json) \
            catalog.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout must come first: it cleans its destination, which would wipe
      # the downloaded artifacts. Only catalog.json is needed from the repo.
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Build asset list from catalog
        id: assets
        run: |
          {
            echo 'files<<EOF'
            jq -r '.binaries[] | "wendy_mcu_\(.name)/wendy_mcu_\(.name).bin"' catalog.json
            echo catalog.json
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Attach firmware to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.assets.outputs.files }}

  # Publish firmware to the GCS bucket + manifests that `wendy os install`
  # reads from (firmware/<chip>/<version>/ and manifests/<chip>.json +
  # manifests/master.json). Mirrors the OS-image publish flow in
  # wendylabsinc/meta-wendyos-jetson by reusing its tools/publisher CLI.
  # Tag-triggered (stable releases) only.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for GCP workload-identity federation
    steps:
      # Checked out for catalog.json, which drives the loop below.
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # The publisher lives in the WendyOS builder repo so the OS and firmware
      # publish paths share one tool. That repo is public, so the default
      # GITHUB_TOKEN can check it out -- no separate token needed.
      - name: Check out publisher tool
        uses: actions/checkout@v5
        with:
          repository: wendylabsinc/meta-wendyos-jetson
          path: builder

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: builder/tools/publisher/go.mod
          cache-dependency-path: builder/tools/publisher/go.sum

      - name: Build publisher
        run: |
          cd builder/tools/publisher
          go build -o "$RUNNER_TEMP/publisher" .

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Publish firmware to GCS
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Tags are vX.Y.Z; GCS manifests use plain X.Y.Z.
          VERSION="${REF_NAME#v}"
          # catalog.json names are the firmwareId key that `wendy os install` queries;
          # artifacts/bins on disk have the wendy_mcu_ prefix.
          for variant in $(jq -r '.binaries[].name' catalog.json); do
            bin="wendy_mcu_${variant}/wendy_mcu_${variant}.bin"
            echo "Publishing ${variant} v${VERSION} from ${bin}"
            # Sequential loop keeps master.json writes serial (no race).
            "$RUNNER_TEMP/publisher" \
              --firmware \
              --chip "$variant" \
              --version "$VERSION" \
              --file "$bin" \
              --notify-discord=false </dev/null
          done
