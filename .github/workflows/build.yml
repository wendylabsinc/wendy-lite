name: Build Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # catalog.json is the single source of truth for the set of firmware variants.
  # Its `binaries` array is shaped exactly like a matrix `include` list, so it
  # can be handed to strategy.matrix as-is.
  catalog:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Generate build matrix from catalog
        id: gen
        run: |
          # catalog.json names are unprefixed (e.g. "esp32c5"); artifacts,
          # release assets, and GCS publish paths have a wendy_mcu_ prefix,
          # stored as asset_name here for downstream jobs to use.
          echo "matrix=$(jq -c '{include: (.binaries | map(. + {asset_name: ("wendy_mcu_" + .name)}))}' catalog.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: catalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    container:
      image: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v5

      # The version a device reports comes from CONFIG_WENDY_FIRMWARE_VERSION_*
      # (components/wendy_core/Kconfig), whose defaults are a dev placeholder.
      # On a tag build the real version is derived from the tag here. The file
      # is always written, even when empty: a file listed in SDKCONFIG_DEFAULTS
      # that does not exist is a CMake FATAL_ERROR, and keeping the build
      # command uniform means PRs exercise this path too.
      - name: Generate version.defaults from tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          echo "# Generated by .github/workflows/build.yml. Not tracked." > version.defaults
          if [ "$IS_TAG" != "true" ]; then
            echo "Not a tag build: keeping Kconfig version defaults."
            exit 0
          fi
          VERSION="${REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::tag '${REF_NAME}' is not vX.Y.Z"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          # APP_PROJECT_VER_* pins esp_app_desc_t.version (what esptool
          # image_info and OTA checks read) to the tag as well; otherwise IDF
          # falls back to git describe, which degrades to "1" on CI's shallow
          # checkout.
          cat >> version.defaults <<EOF
          CONFIG_WENDY_FIRMWARE_VERSION_MAJOR=${MAJOR}
          CONFIG_WENDY_FIRMWARE_VERSION_MINOR=${MINOR}
          CONFIG_WENDY_FIRMWARE_VERSION_PATCH=${PATCH}
          CONFIG_APP_PROJECT_VER_FROM_CONFIG=y
          CONFIG_APP_PROJECT_VER="${VERSION}"
          EOF
          echo "FW_VERSION=${VERSION}" >> "$GITHUB_ENV"
          cat version.defaults

      - name: Build firmware
        shell: bash
        env:
          BOARD_CFG: ${{ matrix.board_cfg }}
          TARGET: ${{ matrix.target }}
        run: |
          . $IDF_PATH/export.sh
          # boards/<board>.cfg is a one-line idf.py argfile holding
          # "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;boards/<board>.defaults".
          # Read it and suffix version.defaults so it is applied last and wins
          # (kconfgen applies --defaults files in order, later overriding
          # earlier). It has to go on set-target: that is what regenerates
          # sdkconfig from the whole chain.
          idf.py "$(cat "boards/${BOARD_CFG}.cfg");version.defaults" \
            set-target "$TARGET"
          idf.py build

      # Fail the release rather than ship a binary carrying the placeholder
      # version under a vX.Y.Z tag. sdkconfig.h is what the firmware sources
      # actually compile against.
      - name: Verify release version landed in the build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          hdr=build/config/sdkconfig.h
          field() { sed -n "s/^#define CONFIG_WENDY_FIRMWARE_VERSION_$1 //p" "$hdr"; }
          got="$(field MAJOR).$(field MINOR).$(field PATCH)"
          if [ "$got" != "$FW_VERSION" ]; then
            echo "::error::firmware version is ${got}, expected ${FW_VERSION}"
            exit 1
          fi
          echo "firmware version ${FW_VERSION} confirmed in ${hdr}"

      - name: Create merged firmware binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET_NAME: ${{ matrix.asset_name }}
          FLASH_SIZE: ${{ matrix.flash_size }}
        run: |
          . $IDF_PATH/export.sh
          cd build
          esptool.py --chip "$TARGET" merge_bin \
            -o "${ASSET_NAME}.bin" \
            --flash_mode dio \
            --flash_size "$FLASH_SIZE" \
            @flash_args

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: build/${{ matrix.asset_name }}.bin

  nightly:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete existing nightly release and tag if present
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          # Create new nightly pre-release at current commit. catalog.json ships
          # alongside the binaries so consumers can discover the variants.
          gh release create nightly \
            --prerelease \
            --title "Nightly" \
            --notes "Automated nightly build from \`main\` ($(date -u '+%Y-%m-%d %H:%M UTC')), commit ${{ github.sha }}" \
            $(jq -r '.binaries[] | "wendy_mcu_\(.name)/wendy_mcu_\(.name).bin"' catalog.json) \
            catalog.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout must come first: it cleans its destination, which would wipe
      # the downloaded artifacts. Only catalog.json is needed from the repo.
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Build asset list from catalog
        id: assets
        run: |
          {
            echo 'files<<EOF'
            jq -r '.binaries[] | "wendy_mcu_\(.name)/wendy_mcu_\(.name).bin"' catalog.json
            echo catalog.json
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Attach firmware to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.assets.outputs.files }}

  # Publish firmware to the GCS bucket + manifests that `wendy os install`
  # reads from (firmware/<chip>/<version>/ and manifests/<chip>.json +
  # manifests/master.json). Mirrors the OS-image publish flow in
  # wendylabsinc/meta-wendyos-jetson by reusing its tools/publisher CLI.
  # Tag-triggered (stable releases) only.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for GCP workload-identity federation
    steps:
      # Checked out for catalog.json, which drives the loop below.
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # The publisher lives in the WendyOS builder repo so the OS and firmware
      # publish paths share one tool. That repo is public, so the default
      # GITHUB_TOKEN can check it out -- no separate token needed.
      - name: Check out publisher tool
        uses: actions/checkout@v5
        with:
          repository: wendylabsinc/meta-wendyos-jetson
          path: builder

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: builder/tools/publisher/go.mod
          cache-dependency-path: builder/tools/publisher/go.sum

      - name: Build publisher
        run: |
          cd builder/tools/publisher
          go build -o "$RUNNER_TEMP/publisher" .

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Publish firmware to GCS
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Tags are vX.Y.Z; GCS manifests use plain X.Y.Z.
          VERSION="${REF_NAME#v}"
          TOKEN="$(gcloud auth print-access-token)"
          # catalog.json names are the firmwareId key that `wendy os install` queries;
          # artifacts/bins on disk have the wendy_mcu_ prefix.
          for variant in $(jq -r '.binaries[].name' catalog.json); do
            bin="wendy_mcu_${variant}/wendy_mcu_${variant}.bin"
            echo "Publishing ${variant} v${VERSION} from ${bin}"
            # Sequential loop keeps master.json writes serial (no race).
            "$RUNNER_TEMP/publisher" \
              --firmware \
              --chip "$variant" \
              --version "$VERSION" \
              --file "$bin" \
              --notify-discord=false \
              --access-token "$TOKEN" </dev/null
          done
