name: PKI enrollment
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Verify reviewed wolfSSL revision
        run: bash tools/verify_wolfssl.sh
      - name: Verify pki-core timestamp and certificate fixtures
        run: |
          cmake -S components/wendy_pki/tests -B build-pki -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-pki -j2
          ctest --test-dir build-pki --output-on-failure

  firmware:
    strategy:
      matrix:
        trust: [usb, embedded]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Trust checkout paths in the build container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/components/wendy_wolfssl/wolfssl"
      - name: Verify reviewed wolfSSL revision
        run: bash tools/verify_wolfssl.sh
      - name: Build ESP32-C6 with enrollment enabled
        shell: bash
        env:
          TRUST_MODE: ${{ matrix.trust }}
        run: |
          set -euo pipefail
          case "$TRUST_MODE" in
            usb|embedded) ;;
            *) printf 'Unsupported trust mode: %s\n' "$TRUST_MODE" >&2; exit 1 ;;
          esac
          . "$IDF_PATH/export.sh"
          # These public test certificates are only for a compile check.
          # This firmware is never published as an installable artifact.
          root=""
          if [ "$TRUST_MODE" = embedded ]; then
            root="$GITHUB_WORKSPACE/components/wendy_pki/tests/fixtures/root.pem"
          fi
          cat > pki-test.defaults <<EOF_CONFIG
          CONFIG_WENDY_CLOUD=y
          CONFIG_WENDY_PKI_DEVICE_ROOTS="$root"
          CONFIG_WENDY_PKI_TSA_ROOTS="$root"
          CONFIG_WENDY_PKI_HTTPS_ROOTS="$root"
          EOF_CONFIG
          idf.py -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;pki-test.defaults' set-target esp32c6
          idf.py build
