name: PKI enrollment
on:
  pull_request:
    branches: [main, gab/relay]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Verify pki-core timestamp and certificate fixtures
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cmake -S components/wendy_pki/tests -B build-pki -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-pki -j2
          ctest --test-dir build-pki --output-on-failure

  firmware:
    strategy:
      matrix:
        bluetooth: [enabled, disabled]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Trust checkout paths in the build container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build ESP32-C6 with enrollment and cloud enabled
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          echo 'CONFIG_WENDY_CLOUD=y' > cloud.defaults
          defaults='sdkconfig.defaults;cloud.defaults'
          if [ "${{ matrix.bluetooth }}" = disabled ]; then
            defaults="$defaults;boards/no-ble.defaults"
          fi
          idf.py -D "SDKCONFIG_DEFAULTS=$defaults" set-target esp32c6
          idf.py build
          grep -q '^CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y$' sdkconfig
          if [ "${{ matrix.bluetooth }}" = disabled ]; then
            grep -q '^# CONFIG_BT_ENABLED is not set$' sdkconfig
          fi
