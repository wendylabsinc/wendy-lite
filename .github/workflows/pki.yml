name: PKI enrollment
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    strategy:
      matrix:
        idf_version: [v6.0.3, v6.1]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: espressif/idf:${{ matrix.idf_version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - name: Verify BLE advertising and enrollment states
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cmake -S components/wendy_ble/tests -B build-ble-tests -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-ble-tests -j2
          ctest --test-dir build-ble-tests --output-on-failure
      - name: Verify LAN enrollment guards
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cmake -S components/wendy_server/tests -B build-server-tests -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-server-tests -j2
          ctest --test-dir build-server-tests --output-on-failure
      - name: Verify Wi-Fi service startup and reconnection
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cmake -S components/wendy_wifi/tests -B build-wifi-tests -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-wifi-tests -j2
          ctest --test-dir build-wifi-tests --output-on-failure
      - name: Verify pki-core timestamp and certificate fixtures
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cmake -S components/wendy_pki/tests -B build-pki -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-pki -j2
          ctest --test-dir build-pki --output-on-failure

  firmware:
    strategy:
      matrix:
        include:
          - bluetooth: enabled
            wasm: disabled
          - bluetooth: disabled
            wasm: disabled
          - bluetooth: enabled
            wasm: enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: espressif/idf:v6.0.3
    steps:
      - uses: actions/checkout@v7
      - name: Trust checkout paths in the build container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build ESP32-C6 with enrollment and cloud enabled
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          echo 'CONFIG_WENDY_CLOUD=y' > cloud.defaults
          defaults='sdkconfig.defaults;cloud.defaults'
          if [ "${{ matrix.wasm }}" = enabled ]; then
            defaults="$defaults;boards/wasm.defaults"
          fi
          if [ "${{ matrix.bluetooth }}" = disabled ]; then
            defaults="$defaults;boards/no-ble.defaults"
          fi
          idf.py -D "SDKCONFIG_DEFAULTS=$defaults" set-target esp32c6
          idf.py build
          grep -q '^CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y$' sdkconfig
          grep -q '^CONFIG_MBEDTLS_USE_BUNDLED_PQC=y$' sdkconfig
          grep -q '^CONFIG_MBEDTLS_SSL_TLS1_3_SIG_MLDSA65=y$' sdkconfig
          grep -q '^# CONFIG_MBEDTLS_DYNAMIC_BUFFER is not set$' sdkconfig
          grep -q '^CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384$' sdkconfig
          grep -q 'liboqs.a' build/*.map
          if [ "${{ matrix.wasm }}" = enabled ]; then
            grep -q '^CONFIG_WENDY_CORE_WASM_APP_SUPPORT=y$' sdkconfig
            grep -q 'libespressif__wasm-micro-runtime.a' build/*.map
          fi
          if [ "${{ matrix.bluetooth }}" = disabled ]; then
            grep -q '^# CONFIG_BT_ENABLED is not set$' sdkconfig
          fi
