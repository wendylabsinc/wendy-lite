name: Promote Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: version must match vX.Y.Z"
            exit 1
          fi

      - name: Push release tag at nightly's commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # targetCommitish may be "main". Resolve the actual nightly tag
          # and fetch its commit, which may be absent from a shallow checkout.
          git fetch --no-tags origin refs/tags/nightly
          COMMIT=$(git rev-parse 'FETCH_HEAD^{commit}')
          git tag "$VERSION" "$COMMIT"
          git push origin "refs/tags/$VERSION"

      # GITHUB_TOKEN pushes do not trigger push workflows. Explicit dispatch
      # does, and uses the release tag for checkout, versioning, and publishing.
      - name: Start release build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh workflow run build.yml --ref "$VERSION"
