name: Promote Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: version must match vX.Y.Z"
            exit 1
          fi

      - name: Push release tag at nightly's commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          # Tag the exact commit the `nightly` pre-release was built from,
          # so promotion always ships what nightly already validated,
          # regardless of what has landed on main since.
          #
          # This must be a real `git push`, not `gh release create` /
          # the REST API's implicit tag creation: GitHub does not fire
          # `on: push: tags:` workflows for tags created through the API,
          # only for actual pushed refs. Pushing the tag here is what makes
          # build.yml's tag-triggered build -> release -> publish jobs run,
          # which build fresh binaries from this commit, attach them to a
          # new GitHub release, and publish firmware to the GCS bucket
          # `wendy os install` reads from.
          COMMIT=$(gh release view nightly --json targetCommitish --jq .targetCommitish)
          git tag "$VERSION" "$COMMIT"
          git push origin "$VERSION"
