# Review large PRs in complete batches using repository-owned automation.
# Trigger scope, model and post-only finding policy are unchanged.
name: AI Security Review
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-review:
    name: Claude Security Review
    if: github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name,
      'ai-suggestion')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Verify origin repo
      env:
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
      run: |
        if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
          echo "Fork PRs are not permitted to trigger this workflow."
          exit 1
        fi
    - name: Fetch immutable review history
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: review-history
        fetch-depth: 0
        sparse-checkout: .github/scripts
        persist-credentials: false
    - name: Load trusted local review automation
      env:
        EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        REVIEWER_BOOTSTRAP_SHA: 82c06eb45576649d016c575fd0d0ad9c64878b01
      run: |
        set -euo pipefail
        reviewer_revision="$EXPECTED_BASE_SHA"
        if ! git -C review-history cat-file -e "$reviewer_revision:.github/scripts/security_review.py" 2>/dev/null; then
          # The introducing PR's base predates these files. Use only the
          # explicitly pinned port in this repository, never the PR head.
          reviewer_revision="$REVIEWER_BOOTSTRAP_SHA"
          if ! git -C review-history cat-file -e "$reviewer_revision^{commit}" 2>/dev/null; then
            git -C review-history fetch --no-tags origin "$reviewer_revision"
          fi
        fi
        reviewer_dir="$RUNNER_TEMP/trusted-reviewer"
        mkdir -p "$reviewer_dir"
        for filename in security_review.py security_review_test.py review_diff.py review_diff_test.py; do
          git -C review-history show "$reviewer_revision:.github/scripts/$filename" > "$reviewer_dir/$filename"
          test -s "$reviewer_dir/$filename"
        done
        echo "Using repository review automation from $reviewer_revision"
    - name: Fetch PR metadata and diff
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        metadata_tmp="$(mktemp)"
        diff_tmp="$(mktemp)"
        cleanup() {
          rm -f "$metadata_tmp" "$diff_tmp"
        }
        trap cleanup EXIT

        if ! gh api "repos/$REPO/pulls/$PR_NUMBER" > "$metadata_tmp"; then
          echo "::error::Could not fetch PR metadata; no security review was performed."
          exit 1
        fi
        jq -e --arg head "$EXPECTED_HEAD_SHA" --arg base "$EXPECTED_BASE_SHA" \
          '.state == "open" and .head.sha == $head and .base.sha == $base' "$metadata_tmp" > /dev/null
        # GitHub's diff endpoint has a 300-file limit. Use the exact reviewed
        # commits without checking out or executing any PR application code.
        git -C review-history fetch --no-tags origin "$EXPECTED_HEAD_SHA"
        diff_base_sha="$(git -C review-history merge-base "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA")"
        git -C review-history diff --no-ext-diff --no-textconv --find-renames \
          "$diff_base_sha" "$EXPECTED_HEAD_SHA" -- > "$diff_tmp"

        jq '{title, body, number, additions, deletions, changed_files, user: {login: .user.login, id: .user.id, type: .user.type}, head: {ref: .head.ref, repo: .head.repo.full_name, sha: .head.sha}}' \
          "$metadata_tmp" > pr_meta.json
        mv "$diff_tmp" pr.diff
        rm -f "$metadata_tmp"
        trap - EXIT
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Test security review automation
      run: |
        python3 "$RUNNER_TEMP/trusted-reviewer/review_diff_test.py"
        python3 "$RUNNER_TEMP/trusted-reviewer/security_review_test.py"
    - name: Validate complete review input
      env:
        EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        python3 "$RUNNER_TEMP/trusted-reviewer/security_review.py" prepare-input \
          --metadata pr_meta.json \
          --diff pr.diff \
          --output input_manifest.json \
          --pr-number "$PR_NUMBER" \
          --expected-head-sha "$EXPECTED_HEAD_SHA"
    - name: Fetch previous security review state
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        python3 "$RUNNER_TEMP/trusted-reviewer/security_review.py" fetch-state \
          --repo "$REPO" \
          --pr-number "$PR_NUMBER" \
          --output previous_security_review.md
    - name: Install Anthropic SDK
      run: pip install --quiet anthropic==0.97.0
    - name: Run security review
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        CLAUDE_MODEL: claude-sonnet-4-6
        REVIEW_FILE: ${{ runner.temp }}/review.md
        RESULT_FILE: ${{ runner.temp }}/review-result.json
      run: |
        python3 "$RUNNER_TEMP/trusted-reviewer/security_review.py" review \
          --metadata pr_meta.json \
          --diff pr.diff \
          --manifest input_manifest.json \
          --previous previous_security_review.md \
          --review-output "$REVIEW_FILE" \
          --result-output "$RESULT_FILE" \
          --model "$CLAUDE_MODEL"
    - name: Validate review result provenance
      id: review_result
      env:
        RESULT_FILE: ${{ runner.temp }}/review-result.json
      run: |
        python3 <<'PYEOF'
        import json
        import os
        from pathlib import Path
        result = json.loads(Path(os.environ['RESULT_FILE']).read_text())
        manifest = json.loads(Path('input_manifest.json').read_text())
        expected = {'credit_unavailable', 'has_blocking', 'head_sha', 'sha256'}
        if (not isinstance(result, dict) or set(result) != expected
            or not isinstance(result.get('credit_unavailable'), bool)
            or not isinstance(result.get('has_blocking'), bool)
            or result.get('head_sha') != manifest.get('head_sha')
            or result.get('sha256') != manifest.get('sha256')):
            raise RuntimeError('Review result does not match the complete PR input')
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            output.write('complete=' + str(not result['credit_unavailable']).lower() + '\n')
        PYEOF
    - name: Prepare security review comment
      env:
        COMMENT_FILE: ${{ runner.temp }}/comment.md
        REVIEW_FILE: ${{ runner.temp }}/review.md
      run: |
        python3 "$RUNNER_TEMP/trusted-reviewer/security_review.py" prepare-comment \
          --review "$REVIEW_FILE" \
          --output "$COMMENT_FILE"
    - name: Post security review comment
      env:
        COMMENT_FILE: ${{ runner.temp }}/comment.md
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        gh api "repos/$REPO/pulls/$PR_NUMBER" > pr_current.json
        jq -e --arg repo "$REPO" --arg head "$EXPECTED_HEAD_SHA" --arg base "$EXPECTED_BASE_SHA" \
          '.state == "open" and .head.repo.full_name == $repo and .base.repo.full_name == $repo and
           .head.sha == $head and .base.sha == $base' pr_current.json > /dev/null
        python3 "$RUNNER_TEMP/trusted-reviewer/security_review.py" post-comment \
          --repo "$REPO" \
          --pr-number "$PR_NUMBER" \
          --comment "$COMMENT_FILE"
    - name: Require complete review coverage
      env:
        REVIEW_COMPLETE: ${{ steps.review_result.outputs.complete }}
      run: |
        # Findings remain post-only, preserving the existing Lite severity policy.
        if [ "$REVIEW_COMPLETE" != true ]; then
          echo '::error::No complete review: provider credits unavailable'
          exit 1
        fi
